{% extends "base.html" %}
{% block title %}Provedores · PromoSend{% endblock %}
{% block content %}
<h1>Provedores</h1>
<div class="providers">
  {% for k, p in PROVIDERS.items() %}
  <a href="{{ url_for('provider', pkey=k) }}" class="panel">
    <h2 style="margin-top:0">{{ p.NAME }}</h2>
    <div class="muted">Busca por: {{ p.TERM_LABEL | lower }}</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
